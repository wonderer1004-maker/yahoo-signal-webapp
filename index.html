<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASDAQ 매매신호</title><link rel="stylesheet" href="style.css"></head><body><main><h1>NASDAQ 매수·매도 전략</h1><p>QQQ SMA175 · RSI14 · VIX · ATR 목표가</p><section><h2 id="signal">데이터 갱신 대기</h2><p id="reason"></p><p id="updated"></p></section><section class="grid"><div><b>QQQ</b><span id="qqq">-</span></div><div><b>SMA175</b><span id="sma">-</span></div><div><b>RSI14</b><span id="rsi">-</span></div><div><b>VIX</b><span id="vix">-</span></div></section><section><h2>매수·매도 판단 기준</h2><p id="rules"></p><p id="distance"></p></section><section><h2>종목별 매수·매도 목표가격 (USD)</h2><div id="targets"></div><p class="note">목표가는 ATR 기반 참고 수준이며 수익을 보장하지 않습니다.</p></section><section><h2>투자금 및 비중 직접 설정</h2><label>총 투자금 (원)<input id="capital" type="number" min="0" step="10000" value="1000000"></label><p id="suggested"></p><label>TQQQ 비중 <output id="tvalue">60%</output><input id="tweight" type="range" min="0" max="100" step="1" value="60"><input id="tnum" type="number" min="0" max="100" value="60">%</label><label>QLD 비중 <output id="qvalue">20%</output><input id="qweight" type="range" min="0" max="100" step="1" value="20"><input id="qnum" type="number" min="0" max="100" value="20">%</label><p id="warning"></p><p id="alloc"></p><p id="money"></p><button id="reset" type="button">전략 추천 비중 적용</button><p class="note">설정값은 이 브라우저에 자동 저장됩니다. 투자금은 원화 기준 목표금액이며 실제 주식 수량·환율·수수료는 반영하지 않습니다.</p></section><button onclick="load()">최신 데이터 새로고침</button><p class="note">Yahoo 종가 기반 연구용 신호입니다.</p></main><script src="app.js"></script></body></html>
